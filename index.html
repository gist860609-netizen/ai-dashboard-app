<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 명령 대시보드</title>
<meta name="theme-color" content="#16302b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 대시보드">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#16302b;--fg:#ebf2ee;--sub:#9fb7ad;--acc:#3fbf9b;--acc-fg:#08130f;--line:rgba(235,242,238,.14)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  display:grid;place-items:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
main{display:grid;gap:18px;justify-items:center;max-width:360px;width:100%}
img{width:96px;height:96px;border-radius:24px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-fg);font:inherit;font-size:17px;font-weight:700;text-decoration:none}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500;font-size:15px;padding:12px}
.tip{font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:14px;width:100%}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--sub);animation:b 1s infinite alternate}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>AI 명령 대시보드</h1>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p id="msg">대시보드를 여는 중이에요</p>
  <a class="btn" id="open" href="#" hidden>대시보드 열기</a>
  <button class="btn ghost" id="install" type="button" hidden>홈 화면에 앱 설치</button>
  <p class="tip" id="how" hidden></p>
</main>
<script>
const url = window.DASH_URL, $ = id => document.getElementById(id);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

function showButton(text){ $('dots').hidden = true; $('msg').textContent = text; $('open').hidden = !url; }
if (!url) { $('dots').hidden = true; $('msg').textContent = '아직 대시보드 주소가 없어요. config.js에 웹앱 주소를 넣어 주세요.'; }
else {
  $('open').href = url;
  let back = false; try { back = sessionStorage.getItem('opened') === '1'; sessionStorage.setItem('opened', '1'); } catch (e) {}
  if (standalone && !back) setTimeout(() => location.replace(url), 350);
  else showButton(standalone ? '다시 열려면 아래 버튼을 누르세요' : '앱으로 설치하면 아이콘을 눌러 바로 열려요');
}

/* 설치 안내: 안드로이드(크롬·삼성 인터넷)는 설치 버튼, 아이폰은 공유 → 홈 화면에 추가 */
let prompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; if (!standalone) $('install').hidden = false; });
$('install').onclick = async () => { if (!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; $('install').hidden = true; };
addEventListener('appinstalled', () => { $('install').hidden = true; $('how').hidden = false; $('how').textContent = '설치했어요. 홈 화면의 아이콘으로 여세요.'; });
if (!standalone) {
  $('how').hidden = false;
  $('how').textContent = ios ? 'Safari에서 공유 버튼 → "홈 화면에 추가"를 누르세요.'
    : '설치 버튼이 안 보이면 브라우저 메뉴(⋮ 또는 ≡) → "홈 화면에 추가" 또는 "앱 설치"를 누르세요.';
}
</script>
</body>
</html>
